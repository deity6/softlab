    <title>SOFT LAB — 新奇交互效果收集与展示</title>

    <!-- Two, not one. A single theme-color is a lie under a dark theme: the
         browser keeps painting the address bar the light value, so the page
         goes dark and the chrome around it stays pale. -->
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
  </head>
